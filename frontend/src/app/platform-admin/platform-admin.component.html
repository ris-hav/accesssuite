<div class="p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-semibold text-gray-900 mb-8">Platform Admin</h1>

    @if (loadError()) {
      <p class="text-red-600">{{ loadError() }}</p>
    }

    <div class="space-y-4">
      @for (client of clients(); track client.id) {
        <div class="bg-white rounded-lg border border-gray-100 shadow-sm p-6">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
              <h2 class="font-medium text-gray-900">{{ client.name }}</h2>
              @if (client.subscription) {
                <span
                  class="text-xs px-2 py-0.5 rounded-full font-medium"
                  [class]="
                    client.subscription.status === 'SUSPENDED'
                      ? 'bg-red-100 text-red-700'
                      : client.subscription.status === 'TRIAL'
                        ? 'bg-amber-100 text-amber-700'
                        : 'bg-green-100 text-green-700'
                  "
                >
                  {{ client.subscription.status }}
                </span>
              }
            </div>
            @if (client.subscription) {
              <button
                (click)="toggleSuspension(client.id, client.subscription.status)"
                class="text-sm px-3 py-1 rounded border"
                [class]="
                  client.subscription.status === 'SUSPENDED'
                    ? 'border-green-300 text-green-600'
                    : 'border-red-300 text-red-600'
                "
              >
                {{ client.subscription.status === 'SUSPENDED' ? 'Reactivate' : 'Suspend' }}
              </button>
            }
          </div>

          <div class="flex flex-wrap gap-4">
            @for (module of moduleCatalog(); track module.id) {
              <label class="flex items-center gap-2 text-sm text-gray-700">
                <input
                  type="checkbox"
                  [checked]="isModuleEnabled(client, module.id)"
                  (change)="toggleModule(client.id, module.id, isModuleEnabled(client, module.id))"
                />
                {{ module.name }}
              </label>
            }
          </div>
        </div>
      }
    </div>
  </div>
</div>
