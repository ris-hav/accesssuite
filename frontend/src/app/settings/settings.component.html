<div class="p-8">
  <div class="max-w-xl mx-auto">
    <h1 class="text-2xl font-semibold text-gray-900 mb-8">Settings</h1>

    @if (loadError) {
      <p class="text-red-600">{{ loadError }}</p>
    } @else if (client) {
      <form [formGroup]="form" (ngSubmit)="submit()" class="bg-white rounded-lg border border-gray-100 shadow-sm p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Company name</label>
          <input
            formControlName="name"
            type="text"
            [readonly]="user()?.role !== 'ADMIN'"
            class="mt-1 w-full rounded border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none read-only:bg-gray-50 read-only:text-gray-500"
          />
        </div>

        @if (user()?.role === 'ADMIN') {
          @if (saveError) {
            <p class="text-sm text-red-600">{{ saveError }}</p>
          }
          @if (saved) {
            <p class="text-sm text-green-600">Saved.</p>
          }
          <button
            type="submit"
            [disabled]="form.invalid"
            class="bg-blue-600 text-white rounded px-4 py-2 text-sm font-medium disabled:opacity-50"
          >
            Save changes
          </button>
        } @else {
          <p class="text-sm text-gray-400">Only an account admin can change this.</p>
        }
      </form>
    } @else {
      <p class="text-gray-500">Loading…</p>
    }
  </div>
</div>
