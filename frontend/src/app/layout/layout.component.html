<div class="min-h-screen flex flex-col bg-slate-50">
  <header class="h-14 shrink-0 flex items-center gap-3 px-4 bg-white border-b border-gray-200 z-10">
    <button
      (click)="toggleSidebar()"
      type="button"
      class="p-2 -ml-2 rounded-md text-gray-500 hover:bg-gray-100 hover:text-gray-900 cursor-pointer transition-colors"
      [attr.aria-label]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <span class="font-semibold text-gray-900 tracking-tight">AccessSuite</span>

    <div class="flex-1"></div>

    @if (user(); as u) {
      <div class="text-right leading-tight hidden sm:block">
        <p class="text-sm text-gray-900">{{ u.email }}</p>
        <p class="text-xs text-gray-500">{{ u.role }}</p>
      </div>
      <button
        (click)="logout()"
        type="button"
        class="text-sm text-gray-600 hover:text-gray-900 cursor-pointer transition-colors"
      >
        Sign out
      </button>
    }
  </header>

  <div class="flex-1 flex min-h-0">
    <aside
      class="shrink-0 bg-slate-900 overflow-hidden transition-[width] duration-200 ease-in-out"
      [class]="sidebarCollapsed() ? 'w-0' : 'w-64'"
    >
      <nav class="w-64 h-full px-3 py-4 space-y-0.5 text-slate-300">
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-slate-800 text-white"
          class="flex items-center rounded-md px-3 py-2 text-sm font-medium hover:bg-slate-800 hover:text-white transition-colors"
        >
          Dashboard
        </a>

        @if (user()?.modules?.includes('reports')) {
          <a
            routerLink="/reports"
            routerLinkActive="bg-slate-800 text-white"
            class="flex items-center rounded-md px-3 py-2 text-sm font-medium hover:bg-slate-800 hover:text-white transition-colors"
          >
            Reports
          </a>
        }

        @if (user()?.role === 'ADMIN') {
          <a
            routerLink="/team"
            routerLinkActive="bg-slate-800 text-white"
            class="flex items-center rounded-md px-3 py-2 text-sm font-medium hover:bg-slate-800 hover:text-white transition-colors"
          >
            Team
          </a>
        }

        @if (user()?.isSuperAdmin) {
          <div class="pt-4 mt-4 border-t border-slate-800">
            <a
              routerLink="/admin"
              routerLinkActive="bg-slate-800 text-white"
              class="flex items-center rounded-md px-3 py-2 text-sm font-medium hover:bg-slate-800 hover:text-white transition-colors"
            >
              Platform Admin
            </a>
          </div>
        }
      </nav>
    </aside>

    <main class="flex-1 min-w-0 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>
