<div class="p-8">
  <div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-semibold text-gray-900 mb-8">Team</h1>

    @if (loadError) {
      <p class="text-red-600 mb-4">{{ loadError }}</p>
    }

    <div class="bg-white rounded-lg border border-gray-100 shadow-sm p-6 mb-6">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-gray-500">
            <th class="pb-2">Email</th>
            <th class="pb-2">Role</th>
          </tr>
        </thead>
        <tbody>
          @for (member of members(); track member.id) {
            <tr class="border-t border-gray-100">
              <td class="py-2 text-gray-900">{{ member.email }}</td>
              <td class="py-2 text-gray-600">{{ member.role }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="bg-white rounded-lg border border-gray-100 shadow-sm p-6 space-y-4">
      <h2 class="font-medium text-gray-900">Add a team member</h2>

      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input
          formControlName="email"
          type="email"
          class="mt-1 w-full rounded border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input
          formControlName="password"
          type="password"
          class="mt-1 w-full rounded border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Role</label>
        <select
          formControlName="role"
          class="mt-1 w-full rounded border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
        >
          <option value="VIEWER">Viewer</option>
          <option value="MANAGER">Manager</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>

      @if (formError) {
        <p class="text-sm text-red-600">{{ formError }}</p>
      }

      <button
        type="submit"
        [disabled]="form.invalid"
        class="w-full bg-blue-600 text-white rounded py-2 font-medium disabled:opacity-50"
      >
        Add member
      </button>
    </form>
  </div>
</div>
