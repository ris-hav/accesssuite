<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <form [formGroup]="form" (ngSubmit)="submit()" class="w-full max-w-sm bg-white p-8 rounded-lg shadow space-y-4">
    <h1 class="text-2xl font-semibold text-gray-900">Sign in to AccessSuite</h1>

    <div>
      <label class="block text-sm font-medium text-gray-700">Email</label>
      <input
        formControlName="email"
        type="email"
        class="mt-1 w-full rounded border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Password</label>
      <input
        formControlName="password"
        type="password"
        class="mt-1 w-full rounded border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    @if (errorMessage) {
      <p class="text-sm text-red-600">{{ errorMessage }}</p>
    }

    <button
      type="submit"
      [disabled]="form.invalid"
      class="w-full bg-blue-600 text-white rounded py-2 font-medium disabled:opacity-50"
    >
      Sign in
    </button>

    <p class="text-sm text-gray-500 text-center">
      New company? <a routerLink="/signup" class="text-blue-600 hover:underline">Create an account</a>
    </p>
  </form>
</div>
